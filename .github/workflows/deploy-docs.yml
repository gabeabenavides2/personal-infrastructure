name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "documentation/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy documentation
        run: |
          rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
          site/ \
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/docs.gabeabenavides.com/"

      - name: Debug SSH key
        run: |
          echo "VPS user: ${{ secrets.VPS_USER }}"
          echo "VPS host: ${{ secrets.VPS_HOST }}"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub